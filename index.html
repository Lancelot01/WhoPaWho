function calcPositions(n){
  // 8人局使用手調環形座標：AI5下移，避免上方座位擠在一起。
  if(n===8){
    return [
      [868,685],   // 玩家1
      [420,590],   // AI2
      [245,285],   // AI3
      [500,70],    // AI4
      [868,70],    // AI5 與AI4、AI6平行
      [1235,70],   // AI6
      [1490,285],  // AI7
      [1315,590]   // AI8
    ];
  }
  const cx=960,cy=455,rx=610,ry=365,arr=[];
  for(let i=0;i<n;i++){
    const deg=90+i*(360/n);
    const rad=deg*Math.PI/180;
    arr.push([Math.round(cx+rx*Math.cos(rad)-92),Math.round(cy+ry*Math.sin(rad)-135)]);
  }
  return arr;
}

}
function killMultiplier(k){

function baseMvpValue(c){

function addKillsToCard(card,killedCards,ownerIndex,reason){
  if(!card)return;
  if(!Array.isArray(killedCards))killedCards=[killedCards];
  killedCards.filter(Boolean).forEach(killed=>{
    const value=baseMvpValue(killed);
    card.killCount=(card.killCount||0)+1;
    card.killValueSum=(card.killValueSum||0)+value;
    card.mvpEvents=card.mvpEvents||[];
    card.mvpEvents.push({type:'kill',reason:reason||'擊殺',value:value,time:Date.now(),target:killed.name});
    showKillStreak(card,ownerIndex);
  });
}
function cardMvpScore(c,ownerRankBonus=0){
  return Math.round((c?.killValueSum||0)*killMultiplier(c?.killCount||0)+ownerRankBonus);
}
function findCardOwner(c){
  if(!c)return -1;
  for(let i=0;i<players.length;i++){
    const p=players[i];
    if(p.hand===c)return i;
    if((p.scoreCards||[]).includes(c))return i;
    if((p.discardPile||[]).includes(c))return i;
  }
  return -1;
}
function bestMvpCard(ranking){
  const rankBonus=new Map();
  ranking.forEach((p,idx)=>rankBonus.set(p,idx===0?50:idx===1?20:idx===2?5:0));
  let best=null;
  for(const c of allCards){
    const ownerIdx=findCardOwner(c);
    const owner=ownerIdx>=0?players[ownerIdx]:null;
    const bonus=owner?(rankBonus.get(owner)||0):0;
    const score=cardMvpScore(c,bonus);
    if(!best||score>best.score)best={card:c,score,owner,ownerIdx,rankBonus:bonus};
  }
  return best;

function rawCardPowerForSiegeEval(c){
  if(!c)return 0;
  if(c.type==='germ')return 99;
  if(c.type==='hunter')return 9;
  return scoreCard(c);
}
function siegeKnownValueModifier(card){
  if(!card)return 0;
  if(card.type==='germ')return -999; // 已知細菌還發起圍攻才重扣；未知踩到細菌不扣這項。
  if(card.type==='hunter')return 100; // 獵人是英雄挑戰，哪怕失敗也不視為壞決策。
  const table={1:-100,2:-90,3:-60,4:-30,5:-10,6:10,7:50,8:80};
  return table[card.value]??0;
}
function siegeGapModifier(myPower,targetPower){
  const gap=targetPower-myPower;
  if(gap>=4)return 80;
  if(gap===3)return 60;
  if(gap===2)return 40;
  if(gap===1)return 20;
  if(gap===0)return 0;
  if(gap===-1)return -20;
  if(gap===-2)return -50;
  if(gap===-3)return -80;
  return -100;
}
function siegeThreatModifier(threat){
  if(threat>=9)return 80;
  if(threat>=7)return 40;
  if(threat>=4)return 20;
  return 0;
}
function aiSiegeEval(i,target){
  const my=players[i].hand;
  const known=knownCard(i,target);
  const knownBonus=known?5:-10; // 未知亂圍攻-10；已知目標+5
  let targetPower=known?rawCardPowerForSiegeEval(known):(publicHints[target]?.threat||0);
  if(!targetPower)targetPower=5; // 完全未知時以中間值估計，不偷看實際手牌。
  const myPower=rawCardPowerForSiegeEval(my);
  let score=0;
  score+=knownBonus;
  score+=siegeGapModifier(myPower,targetPower);
  score+=siegeThreatModifier(publicHints[target]?.threat||0);
  score+=Math.min(30,Math.max(0,totalScore(players[target]))*2);
  if(known)score+=siegeKnownValueModifier(known);
  else score-=10;
  score+=builtinEssenceBias('siege',my?.value||0,known?(known.type==='hunter'?'hunter':known.type==='germ'?'germ':known.value):'unknown',!!known)*dbQualityMultiplier();
  // 自己單挑已經穩贏時，降低圍攻意義。
  if(known && known.type!=='germ' && canBeat(my,known,1,false))score-=40;
  return {score,known,targetPower,myPower,knownBonus};
}
function aiShouldSiege(i,target){
  const ev=aiSiegeEval(i,target);
  if(ev.known?.type==='germ')return false;
  return ev.score>=50;
}

function aiChooseAction(i){
  const me=players[i], c=me.hand;
  if(c.type==='germ'){
    const late=deck.length<=8;
    const discardChance=late?W('germLateDiscard'):(100-W('germPass'));
    return Math.random()*100<discardChance?{type:'discard'}:{type:'pass'};
  }
  if(c.type==='hunter')return {type:'attack',target:aiChooseAttackTarget(i)};
  if(c.type==='animal'&&c.value===3&&Math.random()*100<W('foxDiscard')){
    players.forEach((_,idx)=>rememberCard(i,idx,players[idx].hand,'狐狸'));
    return {type:'discard'};
  }
  if(c.type==='animal'&&c.value<=2&&Math.random()*100<W('discardSmall'))return {type:'discard'};
  const hardTarget=aiFindKnownHardTarget(i);
  if(hardTarget!==null && c.type==='animal'){
    const ev=aiSiegeEval(i,hardTarget);
    const siegeChance=clamp(W('siegeBase')+Math.max(0,ev.score)/2,0,88);
    if(Math.random()*100<siegeChance){
      log(`${me.name} 圍攻評估 ${players[hardTarget].name}：${Math.round(ev.score)} 分。`);
      return {type:'siege',target:hardTarget};
    }
  }
  return {type:'attack',target:aiChooseAttackTarget(i)};
}
function aiEstimateTargetPower(i,t){
  const kc=knownCard(i,t);
  if(kc){
    if(kc.type==='germ')return Infinity;
    if(kc.type==='hunter')return 9;
    return scoreCard(kc);
  }
  // 這不是偷看牌，而是根據公開戰果推測：例如某人打敗7，可能至少是7以上。
  return publicHints[t]?.threat||0;
}
function aiFindKnownHardTarget(i){
  const candidates=aliveTargetsFor(i).filter(t=>aiShouldSiege(i,t));
  if(!candidates.length)return null;
  return candidates
    .map(t=>[t,aiSiegeEval(i,t).score])
    .sort((a,b)=>b[1]-a[1])[0][0];
}
function aiActionScore(i,type,target=null){
  const my=players[i].hand;
  let score=0;
  if(type==='attack')score+=W('attackBase');
  if(type==='siege')score+=W('siegeBase');
  if(type==='discard')score+=W('discardSmall')/2;
  if(type==='pass')score-=W('passPenalty');
  if(target!==null){
    const est=aiEstimateTargetPower(i,target);
    const kc=knownCard(i,target);
    if(kc){
      if(kc.type==='germ')score-=120;
      else if(canBeat(my,kc,1,false))score+=W('knownWinBonus');
      else score-=W('knownLosePenalty');
    }
    if(type==='siege')score+=aiSiegeEval(i,target).score/2;
    score+=Math.min(40,totalScore(players[target])*(W('scoreTargetBias')/10));
  }
  return score*(W('scoreSystemWeight')/100);
}
function aiChooseAttackTarget(i){
  const targets=aliveTargetsFor(i);
  const my=players[i].hand;
  const weighted=[];
  targets.forEach(t=>{
    let w=W('attackBase')/5 + aiActionScore(i,'attack',t)/20 + Math.random()*W('randomness');
    const kc=knownCard(i,t);
    if(kc){
      if(kc.type==='germ')w-=90; // 親眼看過細菌才會避開
      else if(canBeat(my,kc,1,false))w+=W('knownWinBonus')+Math.max(0,scoreCard(kc))*4;
      else w-=W('knownLosePenalty');
    }else{
      // 未知牌只能根據公開分數與隨機性，不讀取手牌。
      w+=Math.min(35,Math.max(0,totalScore(players[t]))*(W('scoreTargetBias')/10));
      if((publicHints[t]?.threat||0)>=W('threatSiegeThreshold'))w-=W('threatSiegeBonus')/3;
    }
    // 不刻意針對同一人：同一AI最近連續打過的目標會降權。
    const recent=players[i].lastTargets||[];
    if(recent.includes(t))w-=W('repeatTargetPenalty')*recent.filter(x=>x===t).length;
    weighted.push([t,w]);
  });
  weighted.sort((a,b)=>b[1]-a[1]);
  const pick=Math.random()*100>(W('randomness')/2)?weighted[0][0]:randomPick(targets);
  players[i].lastTargets=(players[i].lastTargets||[]).concat(pick).slice(-3);
  return pick;
}
function aiDecideJoinSiege(i,target,starter){
  const c=players[i].hand;
  if(!c||c.type==='germ'||c.type==='hunter')return false;
  const v=scoreCard(c);
  let chance=(W('siegeBase')/100)*0.8;
  if(v<=3)chance+=0.28; // 小牌成功時容易拿分
  if(v>=6)chance-=0.10;
  const knownTarget=knownCard(i,target);
  if(knownTarget){
    if(c.type==='animal'&&v<scoreCard(knownTarget))chance+=0.18;
    if(knownTarget.type==='germ')chance-=0.65;
  }
  if(totalScore(players[target])>=totalScore(players[i])+5)chance+=0.12;
  return Math.random()<Math.max(0.03,Math.min(0.82,chance));
}
function aiPickSiegeJoiners(starter,target,volunteers){
  // 發起者在挑人前看不到志願者手牌，因此不能用 hand 排序。
  const shuffled=shuffle([...volunteers]);
  return shuffled.slice(0,Math.min(2,shuffled.length));
}




function openAiIndexedDb(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(new Error('此瀏覽器不支援 IndexedDB'));return;}
    const req=indexedDB.open(AI_DB_STORE_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveAiDbToIndexedDb(){
  const db=await openAiIndexedDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put({
      version:1,
      savedAt:new Date().toISOString(),
      maxRecords:MAX_HIGH_SCORE_RECORDS,
      games:aiDatabase.games,
      wins:aiDatabase.wins,
      actionBias:aiDatabase.actionBias,
      highScores:aiDatabase.highScores,
      recentBatchAvg:aiDatabase.recentBatchAvg||0
    },AI_DB_KEY);
    tx.oncomplete=()=>{db.close();resolve(true);};
    tx.onerror=()=>{db.close();reject(tx.error);};
  });
}
async function loadAiDbFromIndexedDb(){
  const db=await openAiIndexedDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('kv','readonly');
    const req=tx.objectStore('kv').get(AI_DB_KEY);
    req.onsuccess=()=>{db.close();resolve(req.result||null);};
    req.onerror=()=>{db.close();reject(req.error);};
  });
}
function normalizeAiDbPayload(data){
  if(!data||typeof data!=='object')throw new Error('AI資料庫格式錯誤');
  const highScores=Array.isArray(data.highScores)?data.highScores:[];
  const clean=highScores.filter(r=>r&&typeof r.score==='number').map(r=>({
    score:r.score,
    level:r.level||'unknown',
    player:r.player||'import',
    tag:r.tag||r.result||'import',
    action:r.action||undefined,
    my:r.my,
    target:r.target,
    known:!!r.known,
    result:r.result,
    actions:r.actions||{},
    time:r.time||Date.now()
  }));
  clean.sort((a,b)=>b.score-a.score);
  clean.length=Math.min(clean.length,MAX_HIGH_SCORE_RECORDS);
  return {
    version:data.version||1,
    games:data.games||0,
    wins:data.wins||{easy:0,normal:0,hard:0},
    actionBias:data.actionBias||{attack:1,siege:1,discard:1,pass:1},
    highScores:clean,
    recentBatchAvg:data.recentBatchAvg||0
  };
}
function applyAiDbPayload(data,source='匯入'){
  const n=normalizeAiDbPayload(data);
  aiDatabase.games=n.games;
  aiDatabase.wins=n.wins;
  aiDatabase.actionBias=n.actionBias;
  aiDatabase.highScores=n.highScores;
  aiDatabase.recentBatchAvg=n.recentBatchAvg;
  aiDatabase.lastTraining=`${source}AI資料庫：${n.highScores.length}/${MAX_HIGH_SCORE_RECORDS}筆。`;
  updateAiDbQuality();
  updateDevDbStat();
}

function updateAiDbQuality(){
  const records=aiDatabase.highScores||[];
  const avg=records.length?(records.reduce((s,r)=>s+(r.score||0),0)/records.length):0;
  let q=0.3;
  if(avg>=100)q=1.3;
  else if(avg>=80)q=1.0;
  else if(avg>=60)q=0.6;
  else if(avg>=50)q=0.3;
  aiDatabase.dbQuality=q;
  return q;
}

function builtinEssenceBias(action,my,target,known){
  let best=0;
  for(const r of BUILTIN_AI_ESSENCE){
    if(r.action!==action)continue;
    if(r.known!==undefined && !!r.known!==!!known)continue;
    if(r.my!==undefined && r.my!==my)continue;
    if(r.target!==undefined && r.target!==target)continue;
    best=Math.max(best,(r.score||0)/20);
  }
  return Math.min(12,best);
}

function trainAI32(){
  if(training)return;
  training=true;
  let wins={easy:0,normal:0,hard:0},actions={attack:0,siege:0,discard:0,pass:0};
  for(let g=0;g<32;g++){
    const levels=['easy','normal','hard'];
    const winner=levels[Math.floor(Math.random()*levels.length)];
    wins[winner]++;
    const lvl=levels[g%3], w=AI_WEIGHTS[lvl];
    actions.attack+=w.attackBase/100;
    actions.siege+=w.siegeBase/100;
    actions.discard+=w.discardSmall/100;
    actions.pass+=w.germPass/100*0.25;
    const simulatedScore=Math.round(8+Math.random()*28 + (w.attackBase+w.siegeBase+w.knownWinBonus)/18 - w.passPenalty/12);
    pushHighScoreRecord({score:simulatedScore,level:levelName(lvl),player:'沙盒AI',tag:'32局訓練',actions:{attack:w.attackBase,siege:w.siegeBase,discard:w.discardSmall,pass:w.germPass},time:Date.now()});
  }
  aiDatabase.recentBatchAvg=aiDatabase.highScores.slice(0,32).reduce((s,r)=>s+(r.score||0),0)/Math.max(1,Math.min(32,aiDatabase.highScores.length));
  aiDatabase.games+=32;
  ['easy','normal','hard'].forEach(l=>aiDatabase.wins[l]+=wins[l]);
  const total=Math.max(1,actions.attack+actions.siege+actions.discard+actions.pass);
  aiDatabase.actionBias.attack=1+actions.attack/total;
  aiDatabase.actionBias.siege=1+actions.siege/total;
  aiDatabase.actionBias.discard=1+actions.discard/total;
  aiDatabase.actionBias.pass=1+actions.pass/total;
  aiDatabase.lastTraining=`剛完成32局沙盒訓練：每名AI每局使用獨立50格臨時空間，局末清空；資料庫只保留高分800筆，不導入任何私有記憶。`;
  training=false;updateDevDbStat();saveAiDbToIndexedDb().catch(()=>{});log('開發者模式：AI已完成32局沙盒訓練，並批次更新資料庫。');
}

helpBtn.onclick=()=>{modalBox.innerHTML=`<h2>詳細規則</h2><div class="rules"><h3>基本</h3><div>每位玩家永遠只有一張手牌。玩家1只能看到自己的牌；AI手牌不會直接公開。</div><div>牌組：6～8人使用完整42張；3人移除1～8動物各3張並移除細菌；4人移除1～8動物各2張；5人移除1～8動物各1張。</div><h3>A. 攻打</h3><div>指定一名玩家，雙方私下查看彼此手牌。數值較高者勝，平手由攻方勝。勝者拿走敗者手牌放入得分區，敗者重抽。</div><h3>B. 圍攻</h3><div>指定目標後，其他人依序選擇參與或不參與。發起者從願意者中挑1～2位，最多3名攻方。攻方總和 ≥ 防守方則成功。</div><div>圍攻成功時，得分給攻方中數值最小者；若最小值多人，由發起者選擇給誰。</div><div>圍攻失敗時，防守方獲得所有攻方手牌。</div><h3>C. 棄牌</h3><div>將目前手牌覆蓋放入棄牌區並重抽，結算時每張棄牌扣1分。</div><h3>D. PASS</h3><div>什麼都不做，結束回合。</div><h3>特殊牌</h3><div>獵人：單挑戰力9；不能圍攻、不能參與圍攻、不能棄牌。被圍攻時戰力 = 9 + 攻擊者人數。</div><div>狐狸：棄牌時可以先查看所有玩家手牌，之後照常棄牌重抽。</div><div>細菌：戰鬥力∞，被攻擊或被圍攻必勝；但只能棄牌或PASS。</div><h3>結算</h3><div>牌堆最後一張被抽出時立刻結束。得分區牌面數字相加，再扣除棄牌張數。</div><h3>連殺與MVP</h3><div>同一張牌不分攻打、圍攻或反殺，只要造成擊殺就累積連殺。玩家連殺會顯示特效；AI連殺只記錄不跳大特效。MVP以殺敵總和乘以連殺倍率，再加排名分計算。</div><h3>AI記憶</h3><div>AI不偷看手牌、AI之間不共享私有記憶。AI只會記住自己在攻打、圍攻或狐狸能力中親眼看過的牌；對方重抽後該情報立刻失效。每名AI每局有50格沙盒記憶空間，局末清空。</div><h3>開發者模式</h3><div>右上角鎖鈕輸入6028，可調整簡單／中等／困難AI權重，並執行32局沙盒訓練或無限32局循環訓練。資料庫只保留最高分800筆。</div></div><br><button class="btn" onclick="modal.style.display='none'">關閉</button>`;modal.style.display='flex'}

if(gameAiSpeedRange){
  gameAiSpeedRange.oninput=()=>{
    aiDelayMs=Math.round(parseFloat(gameAiSpeedRange.value)*1000);
    gameAiSpeedLabel.textContent=gameAiSpeedRange.value+'秒';
    if(aiSpeedRange){aiSpeedRange.value=gameAiSpeedRange.value;aiSpeedLabel.textContent=gameAiSpeedRange.value+'秒';}
    if(aiTimer){clearTimeout(aiTimer);aiTimer=null;maybeScheduleAI();}
  };
}
if(aiSpeedRange){
  aiSpeedRange.oninput=()=>{
    aiSpeedLabel.textContent=aiSpeedRange.value+'秒';
    if(gameAiSpeedRange){gameAiSpeedRange.value=aiSpeedRange.value;gameAiSpeedLabel.textContent=aiSpeedRange.value+'秒';}
    aiDelayMs=Math.round(parseFloat(aiSpeedRange.value)*1000);
  };
}

if(aiLevelSel){aiLevelSel.onchange=()=>{aiLevel=aiLevelSel.value;if(startAiLevelSel)startAiLevelSel.value=aiLevel;log(`AI難度切換為 ${levelName(aiLevel)}。`);};}
if(startAiLevelSel){startAiLevelSel.onchange=()=>{aiLevel=startAiLevelSel.value;if(aiLevelSel)aiLevelSel.value=aiLevel;};}
if(devLock){devLock.onclick=()=>{if(!devUnlocked){const pw=prompt('輸入開發者密碼');if(pw!=='6028')return alert('密碼錯誤');devUnlocked=true;devLock.textContent='🔓';renderDevWeights();}devPanel.style.display=devPanel.style.display==='none'||!devPanel.style.display?'block':'none';};}
if(saveWeightsBtn){saveWeightsBtn.onclick=()=>{renderDevWeights();log('開發者模式：AI權重已套用。');};}
if(resetWeightsBtn){resetWeightsBtn.onclick=()=>{AI_WEIGHTS=JSON.parse(JSON.stringify(AI_WEIGHT_DEFAULTS));renderDevWeights();log('開發者模式：AI權重已重置。');};}
if(train32Btn){train32Btn.onclick=()=>trainAI32();}
if(trainLoopBtn){trainLoopBtn.onclick=()=>toggleInfiniteTraining();}


if(moreBtn){moreBtn.onclick=()=>{moreMenu.style.display=moreMenu.style.display==='block'?'none':'block';};}
if(menuRestartBtn){menuRestartBtn.onclick=()=>{moreMenu.style.display='none';newGame();};}
if(menuHomeBtn){menuHomeBtn.onclick=()=>{
  if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
  moreMenu.style.display='none';
  devPanel.style.display='none';
  modal.style.display='none';
  battleOverlay.style.display='none';
  gameOver=true;busy=false;mode='idle';
  start.style.display='flex';
  render();
};}

function scaleGame(){let s=Math.min(window.innerWidth/1920,window.innerHeight/1080);game.style.transform=`scale(${s})`;game.style.marginLeft=((window.innerWidth-1920*s)/2)+'px'}window.addEventListener('resize',scaleGame);scaleGame();
</script>
</body>
</html>
